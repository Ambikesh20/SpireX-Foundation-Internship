<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Background Color Changer</h1>
        <p id="color-display">Current Color: <span>Default</span></p>
        
        <div class="button-group">
            <button id="red-btn" class="btn red">Red</button>
            <button id="green-btn" class="btn green">Green</button>
            <button id="blue-btn" class="btn blue">Blue</button>
            <button id="yellow-btn" class="btn yellow">Yellow</button>
            <button id="random-btn" class="btn random">Random Color</button>
            <button id="reset-btn" class="btn reset">Reset</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
